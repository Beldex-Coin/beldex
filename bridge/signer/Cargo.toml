[package]
name = "beldex-bridge-signer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Beldex Sovereign Bridge threshold signer (Phase C) — dual-scheme (CGGMP21/secp256k1 + FROST/ed25519) over one masternode committee"
repository = "https://github.com/Beldex-Coin/beldex"

[lib]
name = "beldex_bridge_signer"
path = "src/lib.rs"

[[bin]]
name = "beldex-bridge-signer"
path = "src/main.rs"

# The scaffold is intentionally std-only so it builds and `cargo test`s with no
# network access and no external crates. The audited TSS crates are added once
# the C.1 residual gate in DUE_DILIGENCE.md is closed. Pins verified 2026-07:
#
#   [dependencies]
#   cggmp21       = { version = "=0.6.3", features = ["curve-secp256k1"] }  # Pevm: secp256k1 CGGMP21 (Kudelski-audited line)
#   frost-ed25519 = "2"                                                      # Pgw:  ed25519 FROST (ZcashFoundation, RFC-9591; NCC-audited core)
#   # transport: thin binding over the C++ liboxenmq (no mature pure-Rust binding — see §2.3 of the plan)
#
#   [dev-dependencies]
#   k256                 = { version = "0.13", features = ["ecdsa", "arithmetic"] }  # C.1(a) ecrecover round-trip
#   sha3                 = "0.10"                                                    # keccak256 test digest
#   libsodium-sys-stable = "1"                                                       # C.1(b) crypto_sign_verify_detached (consensus rule)
#
# NOTE (C.1 finding, DUE_DILIGENCE.md): cggmp21 0.6.3 does NOT provide identifiable
# abort or threshold-key refresh. This affects S2 / Phase F.1 (EVM-leg attribution)
# and Phase J.1 (Pevm refresh = fresh threshold DKG). Resolve before C.2/C.3a.
#
[features]
# Default build stays std-only (no external crates, no network) so the scaffold
# tests run everywhere. The C.1 gate round-trips pull in the audited crates and
# are opt-in:
#
#   cargo test -p beldex-bridge-signer                          # std-only scaffold (default)
#   cargo test -p beldex-bridge-signer --features tss-integration   # (a) k256 ecrecover + (b) libsodium/FROST
#   cargo test -p beldex-bridge-signer --features cggmp21-interop   # + cggmp21 key ↔ ecrecover interop
default = []

# (a) ecrecover round-trip + (b) libsodium consensus-verifier alignment / FROST.
# rand_core is needed by the C.2 DKG driver's RngCore/CryptoRng bounds (non-test).
tss-integration = ["dep:k256", "dep:sha3", "dep:frost-ed25519", "dep:libsodium-sys-stable", "dep:rand_core"]

# cggmp21 key-material ↔ ecrecover interop (heavier dep tree). Implies the above
# (needs k256/sha3). Kept a separate feature so a build/iteration issue in the
# cggmp21/generic-ec API surface does not block the (a)/(b) round-trips.
# round_based (with the simulation feature — cargo unifies it with cggmp21's own
# round_based dep so the party types match) + futures + sha2 drive the real
# no-dealer keygen simulation in `cggmp21_real_dkg`.
cggmp21-interop = ["tss-integration", "dep:cggmp21", "dep:generic-ec", "dep:round-based", "dep:futures", "dep:sha2", "dep:serde_json"]

# Live-mesh Pevm DKG: run the real cggmp21 keygen over the authenticated OMQ mesh
# (round-based's sync state-machine driver bridged to SessionTransport). Needs the
# cggmp21 stack + the socket mesh.
live-pevm-dkg = ["cggmp21-interop", "omq-mesh", "dep:rand"]

# Phase B.9 committee read: the OMQ client that calls beldexd's bridge.committee.
# Needs libzmq at build/link time (the `zmq` crate). The JSON reply parser lives
# in `committee` and is std-only / tested by default; only the transport is gated.
omq-client = ["dep:zmq"]

# C.4 peer-to-peer session mesh: curve-authenticated OMQ transport that carries
# WireMsgs between signers. The codec + dispatch live in `wire` (std-only, tested
# by default); only the live socket backend is gated.
omq-mesh = ["dep:zmq"]

# C.2 live-mesh DKG: run the real FROST DKG across the committee over the
# authenticated OMQ mesh, keyed off the live `bridge.committee` read. Pulls in the
# audited crate (tss-integration), the socket mesh (omq-mesh), and the committee
# client (omq-client). The `main.rs` `dkg` subcommand is gated on this.
live-dkg = ["tss-integration", "omq-mesh", "omq-client", "dep:rand"]

# Phase E.2 EVM watcher (l2_tracker port): decode wBDX burn logs from eth_getLogs,
# confirmation + reorg gating feeding watch::Tracker, emit normalized ReleaseEvents.
# The security-critical decode/gating logic is testable with a mock JSON-RPC client
# (needs serde_json for the reply shape + sha3 for the event topic hash); the real
# blocking HTTP client is a separate, thin opt-in so the core stays dep-light.
evm-watcher = ["dep:serde_json", "dep:sha3"]
evm-watcher-http = ["evm-watcher", "dep:ureq"]

[dependencies]
# All optional; pulled in only by the features above (verified 2026-07).
k256                 = { version = "0.13", features = ["ecdsa", "arithmetic"], optional = true }
sha3                 = { version = "0.10", optional = true }
frost-ed25519        = { version = "2", optional = true }
libsodium-sys-stable = { version = "1", optional = true }
cggmp21              = { version = "=0.6.3", features = ["curve-secp256k1", "spof"], optional = true }
generic-ec           = { version = "0.4", features = ["curve-secp256k1"], optional = true }
# Real no-dealer cggmp21 keygen simulation (cggmp21_real_dkg). round_based MUST be
# the same version cggmp21 =0.6.3 uses so the party/message types unify; the "sim"
# feature enables the in-memory simulation (if the pin names it "dev", swap it).
# crates.io package name is hyphenated ("round-based"); Rust code still
# imports it as `round_based` (cargo maps hyphen -> underscore for the lib).
# MUST match the round-based major cggmp21 =0.6.3 uses (0.4.x via
# cggmp21-keygen 0.5) so MpcParty/Mpc types unify. The in-memory simulation
# is behind the "sim" feature (round_based::sim::run).
round-based          = { version = "0.4", features = ["derive", "sim", "state-machine"], optional = true }
futures              = { version = "0.3", optional = true }
sha2                 = { version = "0.10", optional = true }
# Serialize cggmp21 keygen messages onto the mesh (live-mesh Pevm DKG).
serde_json           = { version = "1", optional = true }
zmq                  = { version = "0.10", optional = true }
# Only the live-dkg binary path needs an RNG in non-test code (the OsRng fed to
# the DKG driver). Tests use the dev-dependency `rand` below.
rand                 = { version = "0.8", optional = true }
# The DKG driver's RngCore/CryptoRng trait bounds (enabled by tss-integration).
rand_core            = { version = "0.6", optional = true }
# Blocking HTTP client for the EVM watcher's real JSON-RPC backend (opt-in via
# `evm-watcher-http`). `rustls` avoids a system OpenSSL build dependency.
ureq                 = { version = "2", default-features = false, features = ["tls", "json"], optional = true }

[dev-dependencies]
rand         = "0.8"
rand_core    = "0.6"
hex          = "0.4"
