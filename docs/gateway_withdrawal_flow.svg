<svg width="680" viewBox="0 0 680 596" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Beldex gateway withdrawal flow</title>
<desc>Flowchart of a Beldex gateway withdrawal: the daemon builds the unsigned transaction and proofs, an external signer verifies and signs it, then every node runs consensus checks ending in the balance decrement at block apply.</desc>
<style>
text{font-family:Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}.ts{font-size:12px;font-weight:400}
.pu rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}.pu .th{fill:#3C3489}.pu .ts{fill:#534AB7}
.gy rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}.gy .th{fill:#444441}.gy .ts{fill:#5F5E5A}
.te rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}.te .th{fill:#085041}.te .ts{fill:#0F6E56}
.lg{fill:#5F5E5A;font-size:12px}.lane{fill:#5F5E5A;font-size:12px}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.box{fill:none;stroke:#D3D1C7;stroke-width:0.5;stroke-dasharray:4 3}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="box" x="40" y="46" width="274" height="312" rx="4"/>
<text class="lane" x="52" y="66">Daemon &#8212; create_transfer RPC</text>
<g class="pu"><rect x="52" y="78" width="250" height="52" rx="4"/><text class="th" x="177" y="99" text-anchor="middle">Balance pre-check</text><text class="ts" x="177" y="116" text-anchor="middle">DB: dests + fee &#8804; balance</text></g>
<line class="arr" x1="177" y1="130" x2="177" y2="144" marker-end="url(#arrow)"/>
<g class="pu"><rect x="52" y="148" width="250" height="52" rx="4"/><text class="th" x="177" y="169" text-anchor="middle">Build inputs and outputs</text><text class="ts" x="177" y="186" text-anchor="middle">gw input, stealth outs</text></g>
<line class="arr" x1="177" y1="200" x2="177" y2="214" marker-end="url(#arrow)"/>
<g class="pu"><rect x="52" y="218" width="250" height="52" rx="4"/><text class="th" x="177" y="239" text-anchor="middle">Generate proofs</text><text class="ts" x="177" y="256" text-anchor="middle">BP+, residual dbl-Schnorr</text></g>
<line class="arr" x1="177" y1="270" x2="177" y2="284" marker-end="url(#arrow)"/>
<g class="pu"><rect x="52" y="288" width="250" height="52" rx="4"/><text class="th" x="177" y="309" text-anchor="middle">Return unsigned blob</text><text class="ts" x="177" y="326" text-anchor="middle">tx_id + hash_to_sign</text></g>
<line class="arr" x1="177" y1="358" x2="177" y2="384" marker-end="url(#arrow)"/>
<rect class="box" x="40" y="388" width="274" height="172" rx="4"/>
<text class="lane" x="52" y="408">External signer (TSS / HSM)</text>
<g class="pu"><rect x="52" y="420" width="250" height="52" rx="4"/><text class="th" x="177" y="441" text-anchor="middle">Independent verification</text><text class="ts" x="177" y="458" text-anchor="middle">parse blob, check dests</text></g>
<line class="arr" x1="177" y1="472" x2="177" y2="486" marker-end="url(#arrow)"/>
<g class="pu"><rect x="52" y="490" width="250" height="52" rx="4"/><text class="th" x="177" y="511" text-anchor="middle">Sign and submit</text><text class="ts" x="177" y="528" text-anchor="middle">one sig, copied to all slots</text></g>
<path class="arr" d="M302 516 L340 516 L340 110 L370 110" marker-end="url(#arrow)"/>
<rect class="box" x="366" y="46" width="274" height="384" rx="4"/>
<text class="lane" x="378" y="66">Consensus &#8212; every node</text>
<g class="gy"><rect x="378" y="84" width="250" height="52" rx="4"/><text class="th" x="503" y="105" text-anchor="middle">Semantic checks</text><text class="ts" x="503" y="122" text-anchor="middle">HF22, null_aid, no flash</text></g>
<line class="arr" x1="503" y1="136" x2="503" y2="150" marker-end="url(#arrow)"/>
<g class="gy"><rect x="378" y="154" width="250" height="52" rx="4"/><text class="th" x="503" y="175" text-anchor="middle">Owner signature check</text><text class="ts" x="503" y="192" text-anchor="middle">latest key, canonical enc</text></g>
<line class="arr" x1="503" y1="206" x2="503" y2="220" marker-end="url(#arrow)"/>
<g class="gy"><rect x="378" y="224" width="250" height="52" rx="4"/><text class="th" x="503" y="245" text-anchor="middle">Balance verification</text><text class="ts" x="503" y="262" text-anchor="middle">BP+, residual proof</text></g>
<line class="arr" x1="503" y1="276" x2="503" y2="290" marker-end="url(#arrow)"/>
<g class="gy"><rect x="378" y="294" width="250" height="52" rx="4"/><text class="th" x="503" y="315" text-anchor="middle">Pool overdraft tracker</text><text class="ts" x="503" y="332" text-anchor="middle">pending &#8804; on-chain balance</text></g>
<line class="arr" x1="503" y1="346" x2="503" y2="360" marker-end="url(#arrow)"/>
<g class="te"><rect x="378" y="364" width="250" height="52" rx="4"/><text class="th" x="503" y="385" text-anchor="middle">Block apply</text><text class="ts" x="503" y="402" text-anchor="middle">balance &#8722;= amt, rewindable</text></g>
<g class="pu"><rect x="52" y="572" width="12" height="12" rx="2"/></g><text class="lg" x="70" y="582">exchange side</text>
<g class="gy"><rect x="220" y="572" width="12" height="12" rx="2"/></g><text class="lg" x="238" y="582">consensus checks</text>
<g class="te"><rect x="420" y="572" width="12" height="12" rx="2"/></g><text class="lg" x="438" y="582">state update</text>
</svg>
